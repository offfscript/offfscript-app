<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offfscript — Dashboard</title>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=League+Gothic:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b12;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --text: #f0f0f0;
      --muted: rgba(240,240,240,0.45);
      --border: rgba(255,255,255,0.08);
      --border-focus: rgba(255,255,255,0.2);
      --gradient: linear-gradient(90deg, #9B5CF6, #EC4899, #FF6B35);
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100svh;
    }

    /* ── Top bar ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(11,11,18,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
    }

    .topbar-wordmark {
      font-family: 'League Gothic', Impact, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.4rem;
      background: linear-gradient(90deg, #9B5CF6, #EC4899, #FF6B35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0.1em 0.2em;
      display: inline-block;
      line-height: 1;
    }

    .btn-signout {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-signout:hover { color: var(--text); border-color: var(--border-focus); }

    /* ── Main layout ── */
    .auth-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 88px 1.5rem 3rem;
      min-height: 100svh;
    }

    /* ── Welcome ── */
    .welcome {
      width: 100%;
      max-width: 480px;
      margin-bottom: 1.75rem;
    }
    .welcome-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .welcome-handle {
      font-family: 'League Gothic', Impact, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 3.2rem);
      line-height: 1.1;
      background: linear-gradient(90deg, #9B5CF6, #EC4899, #FF6B35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0.1em 0.15em 0.1em 0;
      display: inline-block;
    }

    /* ── StoryDrop creator card ── */
    .creator-card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .creator-card-header {
      padding: 1.5rem 1.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .creator-card-product {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .product-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .product-name {
      font-family: 'League Gothic', Impact, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.6rem;
      background: linear-gradient(90deg, #9B5CF6, #EC4899, #FF6B35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0.05em 0.1em 0.05em 0;
      line-height: 1.1;
      display: inline-block;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4ade80;
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.2);
      border-radius: 20px;
      padding: 0.35rem 0.75rem;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      display: inline-block;
    }

    .creator-card-body {
      padding: 1.5rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .creator-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .creator-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .creator-meta { display: flex; flex-direction: column; gap: 0.15rem; }
    .creator-name { font-size: 0.95rem; font-weight: 600; }
    .creator-handle { font-size: 0.78rem; color: var(--muted); }

    .creator-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .stat-cell {
      background: var(--bg);
      padding: 0.85rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      align-items: center;
      text-align: center;
    }

    .stat-cell-num { font-size: 1.05rem; font-weight: 700; }
    .stat-cell-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .creator-card-actions {
      padding: 1.25rem 1.75rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
    }
    @media (max-width: 480px) {
      .creator-card-actions { flex-direction: column; }
      .btn-edit, .btn-live { flex: unset; width: 100%; }
    }

    .btn-edit {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-edit:hover { background: var(--surface-hover); border-color: var(--border-focus); }

    .btn-live {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #9B5CF6, #EC4899, #FF6B35);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: opacity 0.15s;
      text-decoration: none;
    }
    .btn-live:hover { opacity: 0.88; }

    /* ── Coming soon ── */
    .coming-soon {
      width: 100%;
      max-width: 480px;
      margin-top: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .coming-soon-left { display: flex; flex-direction: column; gap: 0.3rem; }

    .coming-soon-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .coming-soon-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #9B5CF6;
      flex-shrink: 0;
      display: inline-block;
    }

    .coming-soon-name {
      font-family: 'League Gothic', Impact, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.6rem;
      color: rgba(240,240,240,0.35);
      line-height: 1.1;
    }

    .coming-soon-desc { font-size: 0.76rem; color: rgba(240,240,240,0.25); line-height: 1.4; }

    .coming-soon-tag {
      flex-shrink: 0;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(240,240,240,0.2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 0.35rem 0.7rem;
      white-space: nowrap;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.68rem;
      color: rgba(240,240,240,0.15);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="topbar-wordmark" style="text-decoration:none;">offfscript</a>
    <a href="index.html" class="btn-signout">Sign out</a>
  </header>

  <div class="auth-layout">
    <div class="welcome">
      <p class="welcome-label">Welcome back</p>
      <div class="welcome-handle">@joyraftdc</div>
    </div>

    <div class="creator-card">
      <div class="creator-card-header">
        <div class="creator-card-product">
          <span class="product-label">Creator platform</span>
          <span class="product-name">StoryDrop</span>
        </div>
        <span class="status-pill"><span class="status-dot"></span>Live</span>
      </div>

      <div class="creator-card-body">
        <div class="creator-info">
          <div class="creator-avatar" style="padding:0;overflow:hidden;"><img src="joyraftdc-avatar.jpg" alt="@joyraftdc" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
          <div class="creator-meta">
            <span class="creator-name">Joyraft DC</span>
            <span class="creator-handle">@joyraftdc &nbsp;·&nbsp; Instagram</span>
          </div>
        </div>

        <div class="creator-stats">
          <div class="stat-cell">
            <span class="stat-cell-num">$250</span>
            <span class="stat-cell-label">Your price</span>
          </div>
          <div class="stat-cell">
            <span class="stat-cell-num">12k</span>
            <span class="stat-cell-label">Avg reach</span>
          </div>
        </div>
      </div>

      <div class="creator-card-actions">
        <button class="btn-edit" type="button">Edit / manage page</button>
        <a class="btn-live" href="#" target="_blank">
          View live page
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 11L11 2M11 2H5M11 2V8" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>

    <footer>&copy; 2026 Offfscript Holdings</footer>
  </div>

</body>
</html>
