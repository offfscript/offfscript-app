<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offfscript</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=League+Gothic:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b12;
      --text: #f0f0f0;
      --muted: rgba(240,240,240,0.45);
      --border: rgba(255,255,255,0.08);
      --gradient: linear-gradient(90deg, #9B5CF6, #EC4899, #FF6B35);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 3rem;
    }

    .wordmark {
      font-family: 'League Gothic', Impact, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: -0.01em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0.2em 0;
      line-height: 1.1;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: -2rem;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 380px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1.75rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
      cursor: pointer;
    }

    .card:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.15);
    }

    .card-left { display: flex; flex-direction: column; gap: 0.25rem; }

    .card-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-name {
      font-family: 'League Gothic', Impact, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.6rem;
      letter-spacing: 0.01em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0.1em 0;
      line-height: 1.1;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .card-arrow {
      font-size: 1.1rem;
      color: var(--muted);
      transition: transform 0.15s;
    }

    .card:hover .card-arrow { transform: translate(3px, -3px); }

    footer {
      font-size: 0.7rem;
      color: rgba(240,240,240,0.2);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <div style="text-align:center">
    <div class="wordmark">offfscript</div>
    <p class="tagline">Boston's media &amp; marketing platform</p>
  </div>

  <div class="cards">
    <a href="https://app.offfscript.com" class="card">
      <div class="card-left">
        <span class="card-label">Marketing platform</span>
        <span class="card-name">Offfscript</span>
        <span class="card-desc">Campaigns, content &amp; analytics</span>
      </div>
      <span class="card-arrow">↗</span>
    </a>

    <a href="https://storydrop.io" class="card">
      <div class="card-left">
        <span class="card-label">Creator monetization</span>
        <span class="card-name">StoryDrop</span>
        <span class="card-desc">Sell your Instagram story frames</span>
      </div>
      <span class="card-arrow">↗</span>
    </a>
  </div>

  <footer>© 2026 Offfscript Holdings</footer>

</body>
</html>
