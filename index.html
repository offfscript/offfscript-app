<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offfscript — Sign in</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=League+Gothic:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b12;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --text: #f0f0f0;
      --muted: rgba(240,240,240,0.45);
      --border: rgba(255,255,255,0.08);
      --border-focus: rgba(255,255,255,0.2);
      --gradient: linear-gradient(90deg, #9B5CF6, #EC4899, #FF6B35);
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      gap: 0;
    }

    /* ── Wordmark ── */
    .wordmark {
      font-family: 'League Gothic', Impact, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.01em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0.4em 0.1em;
      line-height: 1.2;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      margin-bottom: 2.5rem;
    }

    /* ── Login card ── */
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .login-header {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.25rem;
    }

    .product-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .product-name {
      font-family: 'League Gothic', Impact, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: 2rem;
      letter-spacing: 0.01em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0.1em 0;
      line-height: 1.1;
    }

    .product-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .field label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .field input {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    .field input::placeholder { color: rgba(240,240,240,0.2); }
    .field input:focus { border-color: var(--border-focus); }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot {
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .forgot:hover { color: var(--text); }

    .btn-signin {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: none;
      background: var(--gradient);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
      margin-top: 0.25rem;
    }
    .btn-signin:hover { opacity: 0.88; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.72rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .signup-link {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .signup-link a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .signup-link a:hover { opacity: 0.7; }

    /* ── Coming soon card ── */
    .coming-soon {
      width: 100%;
      max-width: 400px;
      margin-top: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .coming-soon-left {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .coming-soon-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .coming-soon-badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gradient);
      background: #9B5CF6;
      flex-shrink: 0;
    }

    .coming-soon-name {
      font-family: 'League Gothic', Impact, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.6rem;
      letter-spacing: 0.01em;
      color: rgba(240,240,240,0.35);
      line-height: 1.1;
    }

    .coming-soon-desc {
      font-size: 0.76rem;
      color: rgba(240,240,240,0.25);
      line-height: 1.4;
    }

    .coming-soon-tag {
      flex-shrink: 0;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(240,240,240,0.2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 0.35rem 0.7rem;
      white-space: nowrap;
    }

    /* ── Footer ── */
    footer {
      margin-top: 2.5rem;
      font-size: 0.68rem;
      color: rgba(240,240,240,0.15);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <div class="wordmark">offfscript</div>

  <!-- StoryDrop login -->
  <div class="login-card">
    <div class="login-header">
      <span class="product-label">Creator platform</span>
      <span class="product-name">StoryDrop</span>
      <p class="product-desc">Monetize your Instagram story frames. Brands book direct — you set the price.</p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
    </div>

    <div class="field">
      <div class="field-row">
        <label for="password">Password</label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn-signin" type="button">Sign in to StoryDrop</button>

    <div class="divider">or</div>

    <p class="signup-link">No account? <a href="#">Apply to join &rarr;</a></p>
  </div>

  <!-- comment2link coming soon -->
  <div class="coming-soon">
    <div class="coming-soon-left">
      <span class="coming-soon-badge">Coming soon</span>
      <span class="coming-soon-name">comment2link</span>
      <span class="coming-soon-desc">Drop a link in any comment. We handle the rest.</span>
    </div>
    <span class="coming-soon-tag">2026</span>
  </div>

  <footer>&copy; 2026 Offfscript Holdings</footer>

</body>
</html>
